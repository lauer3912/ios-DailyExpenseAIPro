# TestFlight Upload — 构建 IPA 并上传到 App Store Connect
name: TestFlight Upload

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build & Test"]
    types: [completed]
    branches: [main]

jobs:
  build-and-upload:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "~26.4.0"

      - name: Import Code-Signing Certificates
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.CERTIFICATE_P12 }}
          p12-password: ${{ secrets.CERTIFICATE_PASSWORD }}

      - name: Write Provisioning Profile
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          # Write base64 to file first, then decode
          printf '%s' "${{ secrets.PROVISIONING_PROFILE }}" > "$HOME/provisioning_profile_b64.txt"
          base64 -d "$HOME/provisioning_profile_b64.txt" > "$HOME/Library/MobileDevice/Provisioning Profiles/DailyExpenseAIPro_App_Store.mobileprovision"
          rm -f "$HOME/provisioning_profile_b64.txt"
          printf '%s' "${{ secrets.PROVISIONING_PROFILE_WIDGET }}" > "$HOME/widget_profile_b64.txt"
          base64 -d "$HOME/widget_profile_b64.txt" > "$HOME/Library/MobileDevice/Provisioning Profiles/DailyExpenseAIProWidget_App_Store.mobileprovision"
          rm -f "$HOME/widget_profile_b64.txt"

      - name: Write API Key
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "${{ secrets.APPSTORE_API_PRIVATE_KEY }}" > "$HOME/api_key_b64.txt"
          base64 -d "$HOME/api_key_b64.txt" > "$HOME/.appstoreconnect/private_keys/ApiKey_${{ vars.APPSTORE_API_KEY_ID }}.p8"
          rm -f "$HOME/api_key_b64.txt"
          chmod 600 "$HOME/.appstoreconnect/private_keys/ApiKey_${{ vars.APPSTORE_API_KEY_ID }}.p8"

      - name: Verify Profiles
        run: |
          echo "=== Verifying Provisioning Profiles ==="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/"
          echo "=== Profile sizes ==="
          wc -c "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision

      - name: Build Archive
        run: |
          mkdir -p build
          xcrun xcodebuild \
            -project DailyExpenseAIPro.xcodeproj \
            -scheme DailyExpenseAIPro \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_IDENTITY="Apple Distribution: ZhiFeng Sun (9L6N2ZF26B)" \
            DEVELOPMENT_TEAM=9L6N2ZF26B \
            -allowProvisioningUpdates \
            -archivePath build/DailyExpenseAIPro.xcarchive \
            archive 2>&1 | tee build/archive.log
          echo "Archive exit code: ${PIPESTATUS[0]}"
          ls -la build/DailyExpenseAIPro.xcarchive

      - name: Export IPA
        run: |
          cat > build/ExportOptions.plist << 'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>method</key>
  <string>app-store-connect</string>
  <key>signingCertificate</key>
  <string>Apple Distribution</string>
  <key>teamId</key>
  <string>9L6N2ZF26B</string>
  <key>provisioningProfiles</key>
  <dict>
    <key>com.ggsheng.DailyExpenseAIPro</key>
    <string>DailyExpenseAIPro App Store</string>
    <key>com.ggsheng.DailyExpenseAIPro.widget</key>
    <string>DailyExpenseAIProWidget App Store</string>
  </dict>
</dict>
</plist>
EOF
          xcrun xcodebuild \
            -exportArchive \
            -archivePath build/DailyExpenseAIPro.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build \
            2>&1 | tee build/export.log
          echo "Export exit code: ${PIPESTATUS[0]}"
          ls -la build/*.ipa 2>/dev/null || echo "No IPA"

      - name: Upload to TestFlight
        run: |
          IPA=$(ls build/*.ipa 2>/dev/null | head -1)
          echo "Uploading IPA: $IPA"
          xcrun altool \
            --upload-app \
            -f "$IPA" \
            -t ios \
            --apiKey "${{ vars.APPSTORE_API_KEY_ID }}" \
            --apiIssuer "${{ vars.APPSTORE_ISSUER_ID }}" \
            --verbose \
            2>&1 | tee build/upload.log
          echo "Upload exit code: ${PIPESTATUS[0]}"

      - name: Add Internal Tester
        env:
          API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          API_ISSUER: ${{ vars.APPSTORE_ISSUER_ID }}
        run: |
          pip3 install pyjwt requests 2>/dev/null || true
          API_KEY_PATH="$HOME/.appstoreconnect/private_keys/ApiKey_${API_KEY_ID}.p8"

          python3 << 'PYTHON'
import jwt, time, requests, os, sys
API_KEY_ID = os.environ['API_KEY_ID']
API_ISSUER = os.environ['API_ISSUER']
API_KEY_PATH = os.path.expanduser(f"~/.appstoreconnect/private_keys/ApiKey_{API_KEY_ID}.p8")
with open(API_KEY_PATH, 'rb') as f:
    private_key = f.read()
token = jwt.encode({"iss": API_ISSUER, "iat": int(time.time()), "exp": int(time.time()) + 3600, "aud": "appstoreconnect-v1", "prn": f"apiKey/{API_KEY_ID}"}, private_key, algorithm="ES256", headers={"kid": API_KEY_ID})
apps = requests.get("https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=com.ggsheng.DailyExpenseAIPro", headers={"Authorization": f"Bearer {token}"})
app_id = apps.json()['data'][0]['id']
print(f"App ID: {app_id}")
groups = requests.get(f"https://api.appstoreconnect.apple.com/v1/apps/{app_id}/betaGroups", headers={"Authorization": f"Bearer {token}"})
internal = next((g for g in groups.json().get('data', []) if g['attributes']['isInternalGroup']), None)
if not internal:
    internal = requests.post(f"https://api.appstoreconnect.apple.com/v1/apps/{app_id}/betaGroups", headers={"Authorization": f"Bearer {token}"}, json={"data": {"attributes": {"name": "Internal Testers", "isInternalGroup": True}, "type": "betaGroups"}}).json()['data']
group_id = internal['id']
print(f"Group ID: {group_id}")
email = "support@techidaily.com"
testers = requests.get(f"https://api.appstoreconnect.apple.com/v1/betaGroups/{group_id}/betaTesters", headers={"Authorization": f"Bearer {token}"})
exists = any(t['attributes']['email'] == email for t in testers.json().get('data', []))
if not exists:
    requests.post(f"https://api.appstoreconnect.apple.com/v1/betaGroups/{group_id}/betaTesters", headers={"Authorization": f"Bearer {token}"}, json={"data": {"attributes": {"email": email}, "type": "betaTesters"}})
    print(f"Added {email}")
else:
    print(f"{email} already exists")
print("Done!")
PYTHON

      - name: Upload Logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: build/*.log
          if-no-files-found: warn
