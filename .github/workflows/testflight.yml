name: TestFlight Upload

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "~26.4.0"

      - name: Import Code-Signing Certificates
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.CERTIFICATE_P12 }}
          p12-password: ${{ secrets.CERTIFICATE_PASSWORD }}

      - name: Copy Provisioning Profiles
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp ".github/profiles/DailyExpenseAIPro_App_Store.mobileprovision" \
             "$HOME/Library/MobileDevice/Provisioning Profiles/"
          cp ".github/profiles/DailyExpenseAIProWidget_App_Store.mobileprovision" \
             "$HOME/Library/MobileDevice/Provisioning Profiles/"
          echo "Profile files copied:"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision

      - name: Write API Key
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "${{ secrets.APPSTORE_API_PRIVATE_KEY }}" | base64 -d > "$HOME/.appstoreconnect/private_keys/ApiKey_${{ vars.APPSTORE_API_KEY_ID }}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/ApiKey_${{ vars.APPSTORE_API_KEY_ID }}.p8"

      - name: Build Archive
        run: |
          mkdir -p build
          xcrun xcodebuild \
            -project DailyExpenseAIPro.xcodeproj \
            -scheme DailyExpenseAIPro \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_IDENTITY="Apple Distribution: ZhiFeng Sun (9L6N2ZF26B)" \
            DEVELOPMENT_TEAM=9L6N2ZF26B \
            PROVISIONING_PROFILE_SPECIFIER="DailyExpenseAIPro App Store" \
            -archivePath build/DailyExpenseAIPro.xcarchive \
            archive 2>&1 | tee build/archive.log
          echo "Archive exit code: ${PIPESTATUS[0]}"
          ls -la build/DailyExpenseAIPro.xcarchive

      - name: Export IPA
        run: |
          cat > build/ExportOptions.plist << 'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>method</key>
  <string>app-store-connect</string>
  <key>signingCertificate</key>
  <string>Apple Distribution</string>
  <key>teamId</key>
  <string>9L6N2ZF26B</string>
  <key>provisioningProfiles</key>
  <dict>
    <key>com.ggsheng.DailyExpenseAIPro</key>
    <string>DailyExpenseAIPro App Store</string>
    <key>com.ggsheng.DailyExpenseAIPro.widget</key>
    <string>DailyExpenseAIProWidget App Store</string>
  </dict>
</dict>
</plist>
EOF
          xcrun xcodebuild \
            -exportArchive \
            -archivePath build/DailyExpenseAIPro.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build \
            2>&1 | tee build/export.log
          echo "Export exit code: ${PIPESTATUS[0]}"
          ls -la build/*.ipa 2>/dev/null || echo "No IPA"

      - name: Upload to TestFlight
        run: |
          IPA=$(ls build/*.ipa 2>/dev/null | head -1)
          echo "Uploading IPA: $IPA"
          xcrun altool \
            --upload-app \
            -f "$IPA" \
            -t ios \
            --apiKey "${{ vars.APPSTORE_API_KEY_ID }}" \
            --apiIssuer "${{ vars.APPSTORE_ISSUER_ID }}" \
            --verbose \
            2>&1 | tee build/upload.log

      - name: Upload Logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: build/*.log
          if-no-files-found: warn
