name: TestFlight Upload

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build & Test"]
    types: [completed]
    branches: [main]

jobs:
  build-and-upload:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "~26.4.0"

      - name: Import Code-Signing Certificates
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.CERTIFICATE_P12 }}
          p12-password: ${{ secrets.CERTIFICATE_PASSWORD }}

      - name: Write Provisioning Profile (Python)
        env:
          MAIN_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
          WIDGET_PROFILE: ${{ secrets.PROVISIONING_PROFILE_WIDGET }}
        run: |
          python3 << 'PYEOF'
import os
import base64

profile_dir = os.path.expanduser("~/Library/MobileDevice/Provisioning Profiles")
os.makedirs(profile_dir, exist_ok=True)

main_profile = os.environ.get('MAIN_PROFILE', '')
widget_profile = os.environ.get('WIDGET_PROFILE', '')

# Decode and write main profile
main_bytes = base64.b64decode(main_profile)
main_path = os.path.join(profile_dir, "DailyExpenseAIPro_App_Store.mobileprovision")
with open(main_path, 'wb') as f:
    f.write(main_bytes)
print(f"Main profile written: {len(main_bytes)} bytes")

# Decode and write widget profile
widget_bytes = base64.b64decode(widget_profile)
widget_path = os.path.join(profile_dir, "DailyExpenseAIProWidget_App_Store.mobileprovision")
with open(widget_path, 'wb') as f:
    f.write(widget_bytes)
print(f"Widget profile written: {len(widget_bytes)} bytes")

# Verify
import subprocess
for path in [main_path, widget_path]:
    result = subprocess.run(['security', 'cms', '-D', '-i', path], capture_output=True)
    if result.returncode == 0:
        print(f"Profile {os.path.basename(path)} decoded successfully")
    else:
        print(f"Profile {os.path.basename(path)} FAILED to decode")
PYEOF

      - name: Write API Key
        env:
          API_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          python3 << 'PYEOF'
import os
import base64

key_dir = os.path.expanduser("~/.appstoreconnect/private_keys")
os.makedirs(key_dir, exist_ok=True)

api_key = os.environ.get('API_KEY', '')
key_bytes = base64.b64decode(api_key)
key_path = os.path.join(key_dir, "ApiKey_${{ vars.APPSTORE_API_KEY_ID }}.p8")
with open(key_path, 'wb') as f:
    f.write(key_bytes)
os.chmod(key_path, 0o600)
print(f"API key written: {len(key_bytes)} bytes")
PYEOF

      - name: Build Archive
        run: |
          mkdir -p build
          xcrun xcodebuild \
            -project DailyExpenseAIPro.xcodeproj \
            -scheme DailyExpenseAIPro \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_IDENTITY="Apple Distribution: ZhiFeng Sun (9L6N2ZF26B)" \
            DEVELOPMENT_TEAM=9L6N2ZF26B \
            -allowProvisioningUpdates \
            -archivePath build/DailyExpenseAIPro.xcarchive \
            archive 2>&1 | tee build/archive.log
          echo "Archive exit code: ${PIPESTATUS[0]}"

      - name: Export IPA
        run: |
          cat > build/ExportOptions.plist << 'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>method</key>
  <string>app-store-connect</string>
  <key>signingCertificate</key>
  <string>Apple Distribution</string>
  <key>teamId</key>
  <string>9L6N2ZF26B</string>
  <key>provisioningProfiles</key>
  <dict>
    <key>com.ggsheng.DailyExpenseAIPro</key>
    <string>DailyExpenseAIPro App Store</string>
    <key>com.ggsheng.DailyExpenseAIPro.widget</key>
    <string>DailyExpenseAIProWidget App Store</string>
  </dict>
</dict>
</plist>
EOF
          xcrun xcodebuild \
            -exportArchive \
            -archivePath build/DailyExpenseAIPro.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build \
            2>&1 | tee build/export.log
          echo "Export exit code: ${PIPESTATUS[0]}"
          ls -la build/*.ipa 2>/dev/null || echo "No IPA"

      - name: Upload to TestFlight
        run: |
          IPA=$(ls build/*.ipa 2>/dev/null | head -1)
          echo "Uploading IPA: $IPA"
          xcrun altool \
            --upload-app \
            -f "$IPA" \
            -t ios \
            --apiKey "${{ vars.APPSTORE_API_KEY_ID }}" \
            --apiIssuer "${{ vars.APPSTORE_ISSUER_ID }}" \
            --verbose \
            2>&1 | tee build/upload.log

      - name: Upload Logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: build/*.log
