name: TestFlight Upload

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "~26.4.0"

      - name: Copy Provisioning Profiles
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp ".github/profiles/DailyExpenseAIPro_App_Store.mobileprovision" \
             "$HOME/Library/MobileDevice/Provisioning Profiles/"
          cp ".github/profiles/DailyExpenseAIProWidget_App_Store.mobileprovision" \
             "$HOME/Library/MobileDevice/Provisioning Profiles/"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Compute Certificate Base64
        run: |
          CERT_B64=$(base64 -i .github/certs/szf_exported_cert.p12 | tr -d '\n')
          echo "CERT_B64=$CERT_B64" >> $GITHUB_ENV

      - name: Import Code-Signing Certificates
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ env.CERT_B64 }}
          p12-password: ${{ secrets.CERTIFICATE_PASSWORD }}

      - name: Copy API Key
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp ".github/certs/AuthKey_${{ vars.APPSTORE_API_KEY_ID }}.p8" \
             "$HOME/.appstoreconnect/private_keys/ApiKey_${{ vars.APPSTORE_API_KEY_ID }}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/ApiKey_${{ vars.APPSTORE_API_KEY_ID }}.p8"

      - name: Build Archive
        run: |
          mkdir -p build
          # With Automatic signing, DO NOT specify CODE_SIGN_IDENTITY
          # Let Xcode automatically select the correct identity based on the certificate
          xcrun xcodebuild \
            -project DailyExpenseAIPro.xcodeproj \
            -scheme DailyExpenseAIPro \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=9L6N2ZF26B \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceSubstitution \
            -archivePath build/DailyExpenseAIPro.xcarchive \
            archive 2>&1 | tee build/archive.log
          # Fail immediately if archive fails
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "Archive failed with exit code ${PIPESTATUS[0]}"
            cat build/archive.log
            exit 1
          fi

      - name: Export IPA
        run: |
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n  <key>method</key>\n  <string>app-store-connect</string>\n  <key>signingCertificate</key>\n  <string>Apple Distribution</string>\n  <key>teamId</key>\n  <string>9L6N2ZF26B</string>\n  <key>provisioningProfiles</key>\n  <dict>\n    <key>com.ggsheng.DailyExpenseAIPro</key>\n    <string>iOS Team Store Provisioning Profile: com.ggsheng.DailyExpenseAIPro</string>\n    <key>com.ggsheng.DailyExpenseAIPro.widget</key>\n    <string>iOS Team Store Provisioning Profile: com.ggsheng.DailyExpenseAIPro.widget</string>\n  </dict>\n</dict>\n</plist>\n' > build/ExportOptions.plist
          xcrun xcodebuild \
            -exportArchive \
            -archivePath build/DailyExpenseAIPro.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build \
            2>&1 | tee build/export.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "Export failed with exit code ${PIPESTATUS[0]}"
            cat build/export.log
            exit 1
          fi

      - name: Upload to TestFlight
        run: |
          IPA=$(ls build/*.ipa 2>/dev/null | head -1)
          if [ -z "$IPA" ]; then
            echo "No IPA file found!"
            exit 1
          fi
          echo "Uploading IPA: $IPA"
          xcrun altool \
            --upload-app \
            -f "$IPA" \
            -t ios \
            --apiKey "${{ vars.APPSTORE_API_KEY_ID }}" \
            --apiIssuer "${{ vars.APPSTORE_ISSUER_ID }}" \
            --verbose \
            2>&1 | tee build/upload.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "Upload failed with exit code ${PIPESTATUS[0]}"
            cat build/upload.log
            exit 1
          fi

      - name: Upload Logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: build/*.log
          if-no-files-found: warn
