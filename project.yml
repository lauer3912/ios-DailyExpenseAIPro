name: DailyExpenseAIPro
options:
  bundleIdPrefix: com.ggsheng
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 9L6N2ZF26B
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  DailyExpenseAIPro:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ggsheng.DailyExpenseAIPro
        PRODUCT_NAME: DailyExpenseAIPro
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_ENTITLEMENTS: ""
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: 9L6N2ZF26B
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
        Release:
          CODE_SIGNING_ALLOWED: YES

  DailyExpenseAIProUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: DailyExpenseAIPro
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ggsheng.DailyExpenseAIPro.UITests
        PRODUCT_NAME: DailyExpenseAIProUITests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9L6N2ZF26B
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        CODE_SIGNING_ALLOWED: NO

schemes:
  DailyExpenseAIPro:
    build:
      targets:
        DailyExpenseAIPro: all
        DailyExpenseAIProUITests: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - DailyExpenseAIProUITests
    profile:
      config: Release
  DailyExpenseAIProUITests:
    build:
      targets:
        DailyExpenseAIProUITests: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DailyExpenseAIProUITests